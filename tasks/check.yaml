---
- name: Check SoftHSM version
  ansible.builtin.command: softhsm2-util --version
  register: softhsm_result
  changed_when: false
  failed_when: false

- name: Check whether any installed version meets requirement
  ansible.builtin.set_fact:
    softhsm_installed_version: >-
      {{ softhsm_result.stdout | trim if softhsm_result.rc == 0 else '0.0.0' }}
    softhsm_install_required: >-
      {{ softhsm_result.stdout is version(softhsm_version,'<',version_type='loose') }}

- name: Display SoftHSM status
  ansible.builtin.debug:
    msg:
      installed_version: "{{ softhsm_installed_version }}"
      requested_version: "{{ softhsm_version }}"
      installation_required: "{{ softhsm_install_required }}"